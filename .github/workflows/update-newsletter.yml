name: Prune past events

on:
  schedule:
    - cron: "0 11 * * *"   # 6am Central (11:00 UTC) every day
  workflow_dispatch:        # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install beautifulsoup4 lxml

      - name: Run pruning script
        run: python update_newsletter.py

      - name: Commit changes if anything moved
        run: |
          git config user.name "newsletter-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Auto-prune past events"
          git push
